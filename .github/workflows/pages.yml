name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must be switched on once by a repository admin, at
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # Until then this step fails with "Get Pages site failed ... Not Found".
      #
      # configure-pages has an `enablement: true` option that creates the site
      # over the API, but it does not help here: GITHUB_TOKEN cannot create a
      # Pages site even with `pages: write`, and the run fails on "Create Pages
      # site failed. Resource not accessible by integration". Enabling it needs
      # admin rights, so it stays a one-time manual step.
      - uses: actions/configure-pages@v5

      # The site is plain static HTML — the repository root is the artifact.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
