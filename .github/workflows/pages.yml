name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement turns Pages on through the API on the first run, using the
      # pages: write permission above, so the deploy does not fail with
      # "Get Pages site failed ... Not Found" on a repository where Pages has
      # never been switched on. It is a no-op once Pages exists.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # The site is plain static HTML — the repository root is the artifact.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
